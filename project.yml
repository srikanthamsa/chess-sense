name: SNSE
options:
  bundleIdPrefix: ai.snse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    # Personal team for srikanthamsa@gmail.com. Keeps signing automatic so the project
    # builds on a device without touching Signing & Capabilities. Not a credential —
    # team identifiers are public in every shipped app's entitlements.
    DEVELOPMENT_TEAM: XKAAC8TL59

targets:
  SNSE:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The core is compiled straight into the targets rather than resolved as a local
      # SwiftPM package: it keeps `swift test` authoritative for the algorithm while
      # avoiding a package graph in the Xcode project.
      - path: Sources/SNSECore
      - path: Resources/Fixtures
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      # Stockfish runs in-process (iOS cannot spawn helpers), so its sources are compiled
      # into the app target. The widget stays engine-free and small.
      - path: Vendor/Stockfish
        type: group
    scheme:
      testTargets:
        - SNSEUITests
    dependencies:
      - target: SNSEWidgets
        embed: true
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        # Stockfish is unusable at -Onone: a Debug build searched for minutes. Swift keeps
        # its own optimisation setting; this only affects the C++ translation units.
        GCC_OPTIMIZATION_LEVEL: 2
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/Stockfish
        SWIFT_OBJC_BRIDGING_HEADER: App/SNSE-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: ai.snse.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "26"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SNSE
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "26"
        UILaunchScreen: {}
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - PlayfairDisplay-Italic-Variable.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true

  SNSEUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: SNSE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.snse.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SNSE
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XKAAC8TL59
        SWIFT_VERSION: "5.0"

  SNSEWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Sources/SNSECore
      # The island draws real piece art, so the widget needs the piece assets too.
      - path: App/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        # Stockfish is unusable at -Onone: a Debug build searched for minutes. Swift keeps
        # its own optimisation setting; this only affects the C++ translation units.
        GCC_OPTIMIZATION_LEVEL: 2
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/Stockfish
        SWIFT_OBJC_BRIDGING_HEADER: App/SNSE-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: ai.snse.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "26"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: SNSE
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "26"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  SNSE:
    build:
      targets:
        SNSE: all
    run:
      config: Debug
    test:
      config: Debug
