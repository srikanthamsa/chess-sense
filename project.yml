name: ChessSense
options:
  bundleIdPrefix: ai.chesssense
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    # Personal team for srikanthamsa@gmail.com. Keeps signing automatic so the project
    # builds on a device without touching Signing & Capabilities. Not a credential —
    # team identifiers are public in every shipped app's entitlements.
    DEVELOPMENT_TEAM: XKAAC8TL59

targets:
  ChessSense:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The core is compiled straight into the targets rather than resolved as a local
      # SwiftPM package: it keeps `swift test` authoritative for the algorithm while
      # avoiding a package graph in the Xcode project.
      - path: Sources/ChessSenseCore
      - path: Resources/Fixtures
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      # Stockfish runs in-process (iOS cannot spawn helpers), so its sources are compiled
      # into the app target. The widget stays engine-free and small.
      - path: Vendor/Stockfish
        type: group
    dependencies:
      - target: ChessSenseWidgets
        embed: true
      - target: ChessSenseBroadcast
        embed: true
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        # Stockfish is unusable at -Onone: a Debug build searched for minutes. Swift keeps
        # its own optimisation setting; this only affects the C++ translation units.
        GCC_OPTIMIZATION_LEVEL: 2
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/Stockfish
        SWIFT_OBJC_BRIDGING_HEADER: App/ChessSense-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: App/ChessSense.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.chesssense.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: chess-sense
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true

  ChessSenseBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Broadcast
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.chesssense.app.broadcast
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Broadcast/ChessSenseBroadcast.entitlements
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XKAAC8TL59
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"

  ChessSenseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Sources/ChessSenseCore
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++11
        # Stockfish is unusable at -Onone: a Debug build searched for minutes. Swift keeps
        # its own optimisation setting; this only affects the C++ translation units.
        GCC_OPTIMIZATION_LEVEL: 2
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/Stockfish
        SWIFT_OBJC_BRIDGING_HEADER: App/ChessSense-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: ai.chesssense.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Best Move
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  ChessSense:
    build:
      targets:
        ChessSense: all
    run:
      config: Debug
    test:
      config: Debug
