name: ChessSense
options:
  bundleIdPrefix: ai.chesssense
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  ChessSense:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The core is compiled straight into the targets rather than resolved as a local
      # SwiftPM package: it keeps `swift test` authoritative for the algorithm while
      # avoiding a package graph in the Xcode project.
      - path: Sources/ChessSenseCore
    dependencies:
      - target: ChessSenseWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.chesssense.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: chess-sense
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true

  ChessSenseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Sources/ChessSenseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.chesssense.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Best Move
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  ChessSense:
    build:
      targets:
        ChessSense: all
    run:
      config: Debug
    test:
      config: Debug
